$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
body:
  type: json
  content: "{ \r

    \    \"firstName\": \"Amity\", \r

    \    \"lastName\": \"Blight\", \r

    \    \"email\": \"amity.blight@bonesborough.example\" \r

    }"
scripts:
