<div class="container">
  <h1>Your accounts</h1>
  <p class="text-muted">Bonesborough Branch</p>

  <div class="card">
    <h3>Main account</h3>
    <p class="amount">1 250,00 Snails</p>
    <button class="btn btn--primary" type="button">Open an account</button>
    <button class="btn btn--secondary" type="button">Edit</button>
    <button class="btn btn--danger" type="button">Close account</button>
  </div>

  <div class="field">
    <label class="field__label" for="test">Email</label>
    <input class="field__input" id="test" type="email" placeholder="luz.noceda@bonesborough.example" />
  </div>

  <p class="alert alert--error">The balance must be zero before the account can be closed.</p>
  <p class="alert alert--success">Account opened.</p>
</div>
